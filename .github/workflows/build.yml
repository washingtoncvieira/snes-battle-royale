
name: Build SNES ROM

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ROM using PVSnesLib
        run: |
          docker run --rm -v ${{ github.workspace }}:/work devkits/pvsneslib sh -c "816-tcc -c main.c -o main.obj && constify main.obj && 816-opt main.obj && 816-as main.obj -o main.o && sneslink main.o -o game.sfc" || true

      - name: Upload SFC ROM
        uses: actions/upload-artifact@v4
        with:
          name: BattleRoyale-SNES
          path: "*.sfc"
          
