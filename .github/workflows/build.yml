name: Build SNES ROM

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment and Build ROM
        run: |
          echo "A descarregar o PVSnesLib..."
          git clone --depth 1 https://github.com/alekmaul/pvsneslib.git /opt/pvsneslib
          export PVSNESLIB_HOME=/opt/pvsneslib/pvsneslib
          
          echo "A compilar o jogo..."
          make

      - name: Upload SFC ROM
        uses: actions/upload-artifact@v4
        with:
          name: BattleRoyale-SNES
          path: "*.sfc"
          
