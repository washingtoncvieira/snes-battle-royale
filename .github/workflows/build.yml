name: Build SNES ROM

on:
  push:
    branches: [ "main", "principal", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build ROM with PVSnesLib
        run: |
          docker run --rm -v ${{ github.workspace }}:/work devkits/pvsneslib sh -c "816-tcc -I/opt/pvsneslib/pvsneslib/include -c main.c -o main.obj && constify main.obj && 816-opt main.obj && 816-as main.obj -o main.o && sneslink main.o -o game.sfc" || make || true

      - name: Upload SFC ROM
        uses: actions/upload-artifact@v3
        with:
          name: BattleRoyale-SNES
          path: "*.sfc"
          
